name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # rustfmt 与 clippy 是独立组件；镜像里可能缺失，显式补齐避免 CI 假失败。
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy

      # 注：CI 不需要 apt-get install libsqlite3-dev —— rusqlite 使用 `bundled`
      # feature 自带并静态编译 SQLite C 源码（由 cc crate 编译）。
      # 同理不需要 libssl-dev：reqwest 只启用 rustls，全树无 OpenSSL/native-tls。
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # 发布物是二进制，release 构建必须也过（并确保产出两个可执行文件）。
      - name: cargo build --release
        run: cargo build --release

      - name: Verify release binaries exist
        run: ls -la target/release/ssm-agent target/release/ssm-relay
