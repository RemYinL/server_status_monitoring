[package]
name = "ssm-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared protocol, config and HMAC signing for ssm-agent / ssm-relay"

[lib]
name = "ssm_common"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.0.7"
tracing = "0.1.44"

[dev-dependencies]
